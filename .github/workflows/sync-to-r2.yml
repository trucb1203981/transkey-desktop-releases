name: Sync release assets to Cloudflare R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.0.7)'
        required: true
        type: string

env:
  R2_BUCKET: s3://transkey-releases
  KEEP_VERSIONS: 3

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release download "$TAG" \
            --repo trucb1203981/transkey-desktop-releases \
            --dir ./assets

      - name: Configure R2 credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Upload to R2 (versioned path)
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Strip leading 'v' if present to get version number
          VER="${TAG#v}"
          aws s3 sync ./assets ${{ env.R2_BUCKET }}/v${VER}/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Upload latest update files to R2 root (for electron-updater)
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # electron-updater (generic provider) fetches latest-mac.yml from the
          # root of the bucket, then downloads the zip file referenced inside it.
          # Both the yml and the zip files must be at the same base URL.
          aws s3 cp ./assets/latest-mac.yml ${{ env.R2_BUCKET }}/latest-mac.yml \
            --endpoint-url "$ENDPOINT"
          aws s3 cp ./assets/latest.yml ${{ env.R2_BUCKET }}/latest.yml \
            --endpoint-url "$ENDPOINT" || true
          # Copy zip files (used by the auto-updater) to root. Filenames carry
          # the version, so nothing overwrites - stale versions are pruned below.
          for f in ./assets/*.zip; do
            [ -f "$f" ] && aws s3 cp "$f" ${{ env.R2_BUCKET }}/$(basename "$f") \
              --endpoint-url "$ENDPOINT"
          done

      - name: Prune previous versions' update files from the R2 root
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          # Root must hold ONLY the current version's updater archives (plus
          # latest*.yml). Older zips used to pile up forever because their
          # versioned filenames never overwrite each other. models/ and the
          # v<X.Y.Z>/ prefixes are directories (PRE lines) - untouched here.
          aws s3 ls ${{ env.R2_BUCKET }}/ --endpoint-url "$ENDPOINT" \
            | awk '$1!="PRE" && $4 ~ /\.(zip|dmg)(\.blockmap)?$/ {print $4}' \
            | while read -r f; do
                case "$f" in
                  *"$VER"*) echo "keep  $f" ;;
                  *)
                    echo "prune $f"
                    aws s3 rm "${{ env.R2_BUCKET }}/$f" --endpoint-url "$ENDPOINT"
                    ;;
                esac
              done

      - name: Cleanup old versioned prefixes (keep latest KEEP_VERSIONS)
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # Versioned prefixes are DIRECTORY lines: "PRE v1.0.7/" - the name is
          # field 2 of a PRE line. The old parser read field 4 (only set on
          # FILE lines), matched nothing, and never deleted anything. The ^v
          # match also keeps non-version prefixes (models/) out of scope.
          VERSIONS=$(aws s3 ls ${{ env.R2_BUCKET }}/ --endpoint-url "$ENDPOINT" \
            | awk '$1=="PRE"{print $2}' \
            | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -V -u)

          TOTAL=$(printf '%s\n' "$VERSIONS" | grep -c . || true)
          KEEP=${{ env.KEEP_VERSIONS }}

          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Only $TOTAL versions, nothing to clean up"
            exit 0
          fi

          DELETE=$(printf '%s\n' "$VERSIONS" | head -n $((TOTAL - KEEP)))
          echo "Keeping latest $KEEP versions, deleting: $(echo $DELETE | tr '\n' ' ')"

          for VER in $DELETE; do
            echo "Deleting $VER/ ..."
            aws s3 rm ${{ env.R2_BUCKET }}/${VER}/ \
              --recursive \
              --endpoint-url "$ENDPOINT"
            echo "  Deleted $VER/"
          done
